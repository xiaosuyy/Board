# luna_pinyin_simp.custom.yaml —— 方案级用户自定义（标准 Rime 配置方式）
#
# 参考微信输入法的【本地】候选行为（不含云端）：
#  1. 候选数量：一页给出更多候选，顶部候选栏可横向滑动。
#  2. 模糊音 + 纠错：对应微信的 fuzzy augmenters（zh/z、ch/c、sh/s、n/l、h/f、前后鼻音）
#     与拼写/按键纠错，打错或口音也能命中常见词。
#  3. 最常见优先：不改变基础词库词频（essay.txt 预置词频 + by_weight），
#     模糊音只以 derive（权重更低）形式追加，绝不压过精确匹配的常用词。
#
# 注意：模糊音必须排在简拼（abbreviation）之前，简拼才会带上模糊音；
# 顺序与官方 pinyin.yaml 顶部注释一致。
patch:
  # 一页候选数（Rime 一次生成多少候选，≠ UI 可见数量）。
  # 顶部候选栏支持横向滑动，候选多一些才真正用得上滑动浏览。
  menu/page_size: 200
  # 开启用户词典学习：选过的候选会被记录并加权，越用越靠前。
  translator/enable_user_dict: true
  # 整句候选：xiangquzijieshangban → 想去字节上班。
  # 整句权重低于精确词，通常排在常用词之后；候选栏只展示前几个。
  translator/enable_sentence: true
  # 前缀补全：输入前缀即可给出更长的词 / 词组（对应微信的 completion 候选）。
  translator/enable_completion: true
  # 用户词优先（对齐微信：用户自定义词 / 常用语优先于基础词库）。
  # 基础词库的权重来自 essay.txt 预置词频，最大值约 4.8e6；custom_phrase 之前的
  # initial_quality 只有 1，比基础词低得多，导致「自己加的词」排不到前面。
  # 这里给一个明显大于基础词频的值，用户自己的词匹配到编码时排在最前。
  custom_phrase/initial_quality: 10000000
  # 模糊音 + 纠错（顺序：模糊音 → 简拼 → 纠错）
  speller/algebra:
    __patch:
      - pinyin:/zh_z_bufen
      - pinyin:/n_l_bufen
      - pinyin:/hu_f_buhun
      - pinyin:/eng_ong_bufen
      - pinyin:/en_eng_bufen
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
  # 现代常用词补充词源：essay.txt 高频 2–4 字词（脚本自动注音）。
  # 基础词库 luna_pinyin 是繁体 / 文言词典，缺很多现代常用词；这里补一份高频常用词，
  # 不加偏移，纯按词频竞争排序。与「额外词源」共用同一个 translators/+ 列表。
  "engine/translators/+":
    - script_translator@board_common
    - script_translator@board_modern
  board_common:
    dictionary: board_common
    enable_completion: false
    enable_sentence: false
    enable_user_dict: false
    enable_encoder: false
    initial_quality: 1
    comment_format:
      - xform/.+//
  # board_modern：现代常用词大词库（华宇野风/清华THUOCL/腾讯词向量等合并），
  # 补齐 luna_pinyin（繁体/文言）与 essay.txt（古典语料）都没有的手机/电脑/快递等
  # 日常词。initial_quality 取 0（与基础词库同权），按词频自然竞争排序。
  board_modern:
    dictionary: board_modern
    enable_completion: false
    enable_sentence: false
    enable_user_dict: false
    enable_encoder: false
    initial_quality: 0
    comment_format:
      - xform/.+//
  # board_common / board_modern 词典必须列入 schema/dependencies，deployer 才会预编译成 table.bin
  "schema/dependencies/+":
    - board_common
    - board_modern
